<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RECALL</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <section id="login" hidden>
    <form id="login-form">
      <h1>RECALL</h1>
      <input id="login-user" placeholder="user" autocomplete="username" autofocus required>
      <button type="submit">Enter</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <section id="app" hidden>
    <aside>
      <div class="bar">
        <strong id="user-name"></strong>
        <button id="logout" class="link">Log out</button>
      </div>
      <select id="agent-select"></select>
      <button id="new-chat">+ New chat</button>
      <ul id="chat-list"></ul>
    </aside>
    <main>
      <div id="messages"></div>
      <details id="usage" hidden><summary></summary><pre></pre></details>
      <form id="composer">
        <textarea id="input" rows="2" placeholder="Write a message…" disabled></textarea>
        <button id="send" type="submit" disabled>Send</button>
      </form>
    </main>
  </section>

  <script src="/static/vendor/marked.umd.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
