# framework-level settings for recall (system config, not user/agent config)

paths:
  config_dir: .config   # user & agent yaml configs
  data_dir: data        # per-agent data plane (sources + index)
  logs_dir: logs        # per-run log folders

index:
  dir_name: .index          # index folder inside each agent's data dir
  collection: memory        # chroma collection name
  file_types: [txt, md, jsonl]  # source files eligible for indexing
  chunk_words: 100          # words per chunk for non-jsonl files

agent:
  max_tool_hops: 5          # max tool round-trips before forcing a final answer

web:
  host: 127.0.0.1           # interface the web ui binds to (no real auth yet: keep it local)
  port: 8000

tavily:
  api_key: TAVILY_API_KEY   # shared env var NAME, never the secret; unset = no web access
  timeout_seconds: 30
  max_content_chars: 16000  # maximum extracted content returned per page

associative_memory:
  context_messages: 6       # recent messages the memory subagent sees
  top_n: 3                  # fragments injected into the active agent
  score_threshold: 0.25     # minimum similarity for a fragment to be injected
