# framework-level settings for recall (system config, not user/agent config)

paths:
  config_dir: .config   # user & agent yaml configs
  data_dir: data        # per-agent data plane (sources + index)
  logs_dir: logs        # per-run log folders

index:
  dir_name: .index          # index folder inside each agent's data dir
  collection: memory        # chroma collection name
  file_types: [txt, md, jsonl]  # source files eligible for indexing
  chunk_words: 100          # words per chunk for non-jsonl files

agent:
  max_tool_hops: 5          # max tool round-trips before forcing a final answer

web:
  host: 127.0.0.1           # interface the web ui binds to
  port: 8000
  session_secret_env: RECALL_SESSION_SECRET  # env var containing the signing secret

telegram:
  allowed_users_env: TELEGRAM_ALLOWED_USERS  # comma-separated telegram_id=recall_user_id entries

video:
  frame_interval_seconds: 5  # seconds between frames sampled from videos sent to image-only models
  max_frames: 16             # frames sent per video; the rest of the video is not sampled
  max_width: 768             # frames are scaled down to this width in pixels to limit cost

pdf:
  max_pages: 30               # pages accepted per PDF; longer documents are rejected
  ocr_min_chars: 25           # pages with fewer extractable characters are read with Tesseract
  ocr_dpi: 300                # render resolution for pages sent to Tesseract
  ocr_languages: eng+spa      # Tesseract language packs, joined with +; they must be installed
  tesseract_cmd: null         # optional path to the tesseract executable; null uses PATH, then the default Windows folder

speech_to_text:
  zdr: true
  language: null  # optional ISO-639-1 code; null enables provider auto-detection

prompt_cache:
  enabled: true                     # mark Claude prompts on OpenRouter with cache breakpoints (see docs/config.md)
  anthropic_providers: [Amazon Bedrock]  # preferred OpenRouter routes for Claude; other ZDR routes stay as fallback
  trim_slack_percent: 25            # when history passes conversation_messages_retained, cut this much extra; 0 trims one message at a time

tavily:
  api_key: TAVILY_API_KEY   # shared env var NAME, never the secret; unset = no web access
  timeout_seconds: 30
  max_content_chars: 16000  # maximum extracted content returned per page

associative_memory:
  context_messages: 6       # recent messages the memory subagent sees
  top_n: 3                  # fragments injected into the active agent
  score_threshold: 0.25     # minimum similarity for a fragment to be injected
  query_model: openai/gpt-4o-mini  # small OpenRouter model that proposes the search query; null uses each chat's own model
  api_key: OPENROUTER_API_KEY      # shared env var NAME for the OpenRouter key, never the secret
  zdr: true                        # only route query requests to zero data retention providers

chat_naming:
  model: openai/gpt-4o-mini    # small OpenRouter model that names chats
  api_key: OPENROUTER_API_KEY  # shared env var NAME for the OpenRouter key, never the secret
  zdr: true                    # only route naming requests to zero data retention providers
  min_messages: 5              # chats shorter than this keep the first-message title

# MCP servers offered to every user; each user connects their own account in Settings,
# and each agent enables the servers it needs (see docs/mcp.md)
mcp:
  connect_timeout_seconds: 120  # server start and tool listing (the first npx run downloads it)
  call_timeout_seconds: 60      # maximum time for one tool call
  servers:
    google_calendar:
      name: Google Calendar
      description: Read and manage events in the user's Google Calendar.
      command: npx
      args: ["-y", "@cocal/google-calendar-mcp@2.8.1"]
      env:
        GOOGLE_OAUTH_CREDENTIALS: {env: GOOGLE_OAUTH_CREDENTIALS}  # shared env var NAME holding the OAuth client JSON path
        GOOGLE_CALENDAR_MCP_TOKEN_PATH: {user_file: tokens.json}  # per-user token file
      exclude_tools: [manage-accounts]  # accounts are connected from RECALL's Settings
      auth:
        args: ["-y", "@cocal/google-calendar-mcp@2.8.1", "auth"]
        credential_file: tokens.json
