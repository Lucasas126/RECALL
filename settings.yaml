# framework-level settings for recall (system config, not user/agent config)

paths:
  config_dir: .config   # user & agent yaml configs
  data_dir: data        # per-agent data plane (sources + index)
  logs_dir: logs        # per-run log folders

index:
  dir_name: .index          # index folder inside each agent's data dir
  collection: memory        # chroma collection name
  file_types: [txt, md, jsonl]  # files the text search tools read; md/txt are indexed, jsonl only as conversations
  chunk_tokens: 400         # target chunk size in estimated tokens (characters / 4)
  max_chunk_tokens: 600     # larger paragraphs or code blocks are split
  overlap_tokens: 60        # text repeated at the start of the next chunk of the same section
  embed_batch: 64           # texts per embeddings request
  folders_reconcile_minutes: 10  # minimum time between background scans of the agents' user folders

agent:
  max_tool_hops: 5          # max tool round-trips before forcing a final answer

memory_limits:
  soul_chars: 15000         # maximum characters of an agent's SOUL.md (1000-100000)
  memory_chars: 2500        # maximum characters of an agent's MEMORY.md, injected in every prompt (100-50000)
  user_chars: 2500          # maximum characters of an agent's USER.md, injected in every prompt (100-50000)

web:
  host: 127.0.0.1           # interface the web ui binds to
  port: 8000
  session_secret_env: RECALL_SESSION_SECRET  # env var containing the signing secret
  public_url: ""            # address users open the web ui at, e.g. http://<server-ip>:8000; links in Telegram notifications (RECALL_PUBLIC_URL overrides it)

telegram:
  allowed_users_env: TELEGRAM_ALLOWED_USERS  # comma-separated telegram_id=recall_user_id entries
  chat_idle_minutes: 60  # minutes without a message after which a new chat starts (1-10080)

video:
  frame_interval_seconds: 5  # seconds between frames sampled from videos sent to image-only models
  max_frames: 16             # frames sent per video; the rest of the video is not sampled
  max_width: 768             # frames are scaled down to this width in pixels to limit cost

pdf:
  max_pages: 30               # pages accepted per PDF; longer documents are rejected
  ocr_min_chars: 25           # pages with fewer extractable characters are read with Tesseract
  ocr_dpi: 300                # render resolution for pages sent to Tesseract
  ocr_languages: eng+spa      # Tesseract language packs, joined with +; they must be installed
  tesseract_cmd: null         # optional path to the tesseract executable; null uses PATH, then the default Windows folder

speech_to_text:
  # zdr: false  # optional override of the user's require_zdr (user.yaml) for transcription; unset follows it
  language: null  # optional ISO-639-1 code; null enables provider auto-detection

claude_subscription:
  # Who may use the Claude Code CLI's DEFAULT login (the login of the OS account running RECALL) when they have no
  # claude_config_dir of their own in user.yaml. Users with their own folder always use it. Empty = nobody: every
  # user must configure their own login folder. Anthropic's terms do not allow sharing one login between people, so
  # list only the person whose login it is. Example: default_login_users: [<user_id>]
  # RECALL_CLAUDE_DEFAULT_LOGIN_USERS (comma-separated ids, process environment) replaces this list, so the id can
  # stay out of this tracked file. See docs/claude-subscription.md.
  default_login_users: []

prompt_cache:
  enabled: true                     # mark Claude prompts on OpenRouter with cache breakpoints (see docs/reference/settings-yaml.md)
  anthropic_providers: [Amazon Bedrock]  # preferred OpenRouter routes for Claude; other routes stay as fallback
  trim_slack_percent: 25            # when history passes conversation_messages_retained, cut this much extra; 0 trims one message at a time

tavily:
  api_key: TAVILY_API_KEY   # shared env var NAME, never the secret; unset = no web access
  timeout_seconds: 30
  max_content_chars: 16000  # maximum extracted content returned per page

associative_memory:
  context_messages: 6       # recent messages the memory subagent sees
  top_n: 3                  # default maximum fragments injected per turn; each user can choose their own in Settings
  score_threshold: 0.35     # minimum similarity for a fragment to be injected (application-wide, not per user)
  query_model: openai/gpt-4o-mini  # small OpenRouter model that proposes the search query; null uses each chat's own model
  api_key: OPENROUTER_API_KEY      # shared env var NAME for the OpenRouter key, never the secret
  # zdr: false                     # optional override of the user's require_zdr (user.yaml) for query requests; unset follows it

# Telegram orchestrator (see docs/user-guide/telegram.md): when a Telegram message starts a NEW chat, a fast "decision
# model" picks the best agent from the agents' descriptions; the user can override with buttons.
# Only the message text and the agents' ids, names and descriptions are sent, never history or attachments.
orchestrator:
  enabled: false                  # opt-in; each user can switch it on or off in Settings
  model: typesafe/jev-1.14        # OpenRouter decision model (alpha Decisions API); others: liquid/d1.1, cloudflare/clef-flash
  api_key: OPENROUTER_API_KEY     # shared env var NAME for the OpenRouter key, never the secret
  # zdr: false                    # optional override of the user's require_zdr (user.yaml); unset follows it
  min_confidence: 0.6             # below this the choice is "uncertain" and the user gets candidate buttons
  timeout_seconds: 4              # 1-30; a slower router is ignored and the preferred agent answers
  grace_seconds: 8                # wait before answering with a confident pick
  uncertain_grace_seconds: 20     # wait before answering with the core/preferred agent when unsure

chat_naming:
  model: openai/gpt-4o-mini    # small OpenRouter model that names chats
  api_key: OPENROUTER_API_KEY  # shared env var NAME for the OpenRouter key, never the secret
  # zdr: false                 # optional override of the user's require_zdr (user.yaml) for naming requests; unset follows it
  min_messages: 5              # chats shorter than this keep the first-message title

# MCP servers offered to every user; each user connects their own account in Settings,
# and each agent enables the servers it needs (see docs/user-guide/mcp.md)
mcp:
  connect_timeout_seconds: 120  # server start and tool listing (the first npx run downloads it)
  call_timeout_seconds: 60      # maximum time for one tool call
  servers:
    google_calendar:
      name: Google Calendar
      description: Read and manage events in the user's Google Calendar.
      command: npx
      args: ["-y", "@cocal/google-calendar-mcp@2.8.1"]
      env:
        GOOGLE_OAUTH_CREDENTIALS: {env: GOOGLE_OAUTH_CREDENTIALS}  # shared env var NAME holding the OAuth client JSON path
        GOOGLE_CALENDAR_MCP_TOKEN_PATH: {user_file: tokens.json}  # per-user token file
      exclude_tools: [manage-accounts]  # accounts are connected from RECALL's Settings
      auth:
        args: ["-y", "@cocal/google-calendar-mcp@2.8.1", "auth"]
        credential_file: tokens.json

# Terminal tool group (see docs/user-guide/terminal.md): commands run in a sandbox reached over SSH, with approvals
terminal:
  approval_timeout_seconds: 300  # a pending approval is denied after this long
  allow_local: false             # accept `type: local` backends (commands run on THIS host); trusted single-user installs only
  default_timeout_seconds: 60    # command timeout when the agent sets none
  max_timeout_seconds: 600       # ceiling for any command timeout
  max_output_chars: 20000        # ceiling for the output returned to the model
  protected_paths: []            # extra glob patterns (repo-relative or absolute) a `local` backend may never read or use; see docs/user-guide/terminal.md

# Subagents (the `delegate` tool group, see docs/user-guide/delegation.md): a parent agent hands a task to a short-lived worker
# in a hidden chat. An agent's `delegation` block can only lower these numbers. Depth is fixed at 1: a worker cannot launch tasks.
subagents:
  max_parallel_per_parent: 3     # tasks running at once for one parent chat
  max_parallel_per_user: 4       # tasks running at once for one user
  max_launches_per_turn: 5       # task_start calls in one parent turn
  timeout_seconds: 600           # wall clock of one task (10-3600)
  max_tokens: 200000             # input + output tokens of one task
  result_max_chars: 8000         # longest result text handed back to the parent
  rate_limit_cooldown_seconds: 300  # after a provider rate limit (429) no task starts for this long (60-86400)
  max_followups: 5               # task_send follow-ups per task
  max_auto_wakes: 3              # parent turns started by a task result in a row, without a user message in between
  wake_debounce_seconds: 1.5     # results ending within this window are delivered as one message
  daily_token_budget: 1000000    # input + output tokens of ALL a user's tasks per local day; 0 = unlimited; over it no task starts until midnight
