name: Prune old image versions

# One-off maintenance: delete every version of the ghcr.io/<owner>/recall package
# except the image tagged `keep` and every manifest it references (platform images,
# attestations). Run it by hand; dry run unless `apply` is true.
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Tag to keep (with all its child manifests)"
        required: true
        default: "0.4.2"
      apply:
        description: "Really delete (false = only list)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: recall
      KEEP: ${{ inputs.keep }}
      APPLY: ${{ inputs.apply }}
    steps:
      - name: Log in to ghcr.io
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin

      - name: Prune
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/${PACKAGE}"
          # Digests to keep: the tag's own manifest plus every manifest it lists.
          raw=$(docker buildx imagetools inspect --raw "$image:$KEEP")
          top=$(docker buildx imagetools inspect "$image:$KEEP" --format '{{json .Manifest}}' | jq -r .digest)
          keep=$( { echo "$top"; echo "$raw" | jq -r '.manifests[]?.digest'; } | sort -u)
          echo "Keeping $(echo "$keep" | wc -l) digests for $image:$KEEP:"; echo "$keep"
          [ "$(echo "$keep" | wc -l)" -ge 1 ] && [ -n "$top" ] || { echo "nothing to keep, aborting"; exit 1; }

          gh api --paginate "users/$OWNER/packages/container/$PACKAGE/versions?per_page=100" \
            --jq '.[] | [.id, .name, ((.metadata.container.tags // []) | join(","))] | @tsv' > versions.tsv
          echo "Package has $(wc -l < versions.tsv) versions"
          n=0
          while IFS=$'\t' read -r id digest tags; do
            if echo "$keep" | grep -qx "$digest"; then
              echo "KEEP   $id $digest [$tags]"; continue
            fi
            n=$((n+1))
            if [ "$APPLY" = "true" ]; then
              gh api -X DELETE "users/$OWNER/packages/container/$PACKAGE/versions/$id" >/dev/null
              echo "DELETE $id $digest [$tags]"
            else
              echo "WOULD DELETE $id $digest [$tags]"
            fi
          done < versions.tsv
          echo "$n versions $( [ "$APPLY" = "true" ] && echo deleted || echo 'would be deleted (dry run)')"

      - name: Check the kept image still resolves
        if: inputs.apply
        run: docker buildx imagetools inspect "ghcr.io/${OWNER,,}/${PACKAGE}:${KEEP}" | head -20
